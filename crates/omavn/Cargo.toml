[package]
name = "omavn"
description = "Play visual novels on Linux. Point it at whatever you downloaded and it figures out the rest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
indicatif = "0.18.6"
omavn-core = { version = "0.5.0", path = "../omavn-core" }
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"

